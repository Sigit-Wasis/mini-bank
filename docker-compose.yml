version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-bank-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - APP_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=minibank
      - DB_PASSWORD=secretpassword
      - DB_NAME=minibank_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    depends_on:
      - postgres
      - redis
    networks:
      - minibank-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-bank-worker
    command: ["./mini-bank-worker"]
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=minibank
      - DB_PASSWORD=secretpassword
      - DB_NAME=minibank_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
    depends_on:
      - postgres
      - redis
    networks:
      - minibank-network

  postgres:
    image: postgres:16-alpine
    container_name: mini-bank-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=minibank
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=minibank_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - minibank-network

  redis:
    image: redis:7-alpine
    container_name: mini-bank-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - minibank-network

volumes:
  postgres_data:
  redis_data:

networks:
  minibank-network:
    driver: bridge
