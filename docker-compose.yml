version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mini-bank-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=minibank
      - DB_PASSWORD=secretpassword
      - DB_NAME=minibank_db
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: mini-bank-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=minibank
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=minibank_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
